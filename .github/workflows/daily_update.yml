name: Something Fishy All-Day News Robot

on:
  schedule:
    # Runs automatically every 4 hours (6:00 AM, 10:00 AM, 2:00 PM, 6:00 PM, 10:00 PM, 2:00 AM Manila Time)
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run All-Day News Robot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_feed.py

      - name: Publish fresh daily_feed.json
        run: |
          git config user.name "Something Fishy Bot"
          git config user.email "bot@users.noreply.github.com"
          git add daily_feed.json
          git diff --staged --quiet || git commit -m "Auto-update all-day news briefing"
          git pull --rebase origin main
          git push
