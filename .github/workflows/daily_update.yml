name: Something Fishy Morning News Robot

on:
  schedule:
    # Runs automatically every day at 6:00 AM Manila Time (22:00 UTC)
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Morning News Robot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_feed.py

      - name: Publish fresh daily_feed.json
        run: |
          git config user.name "Something Fishy Bot"
          git config user.email "bot@users.noreply.github.com"
          git add daily_feed.json
          git diff --staged --quiet || git commit -m "Auto-update daily news briefing"
          git pull --rebase origin main
          git push
